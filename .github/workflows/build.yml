name: Build APK

# يشتغل لوحده مع كل رفع، أو يدوي من تبويب Actions -> Run workflow.
# بيدعم الحالتين:
#   1) المشروع مرفوع كملفات عادية (settings.gradle.kts في أول الـ repo)
#   2) المشروع مرفوع وهو ZIP (أي ملف .zip) -> بيتفك أثناء البناء ويتبني.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (unzip if zipped)
        id: loc
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            ROOT="$PWD"
            echo "Project found as plain files."
          else
            ZIP=$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "::error::No Gradle project and no .zip file found in the repo."
              exit 1
            fi
            echo "Unzipping: $ZIP"
            mkdir -p "$RUNNER_TEMP/proj"
            unzip -q -o "$ZIP" -d "$RUNNER_TEMP/proj"
            SETTINGS=$(find "$RUNNER_TEMP/proj" -name 'settings.gradle*' -not -path '*/__MACOSX/*' | head -n 1)
            if [ -z "$SETTINGS" ]; then
              echo "::error::Zip does not contain settings.gradle(.kts)."
              exit 1
            fi
            ROOT=$(cd "$(dirname "$SETTINGS")" && pwd)
          fi
          echo "Project root: $ROOT"
          ls -la "$ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Pin Moonshine version and minSdk 26
        shell: bash
        working-directory: ${{ steps.loc.outputs.root }}
        run: |
          sed -i -E 's/(ai\.moonshine:moonshine-voice:)[0-9][0-9.]*/\10.1.5/' app/build.gradle.kts
          sed -i -E 's/minSdk = [0-9]+/minSdk = 26/' app/build.gradle.kts
          grep -nE "moonshine|minSdk" app/build.gradle.kts

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install Gradle 8.7 (retry + GitHub mirror)
        shell: bash
        run: |
          set -euo pipefail
          V=8.7
          cd "$RUNNER_TEMP"
          ok=0
          for url in \
            "https://github.com/gradle/gradle-distributions/releases/download/v${V}.0/gradle-${V}-bin.zip" \
            "https://services.gradle.org/distributions/gradle-${V}-bin.zip"; do
            for i in 1 2 3 4; do
              if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 -o gradle.zip "$url" && unzip -tq gradle.zip > /dev/null 2>&1; then
                ok=1; break 2
              fi
              echo "Download failed (try $i) from $url"; sleep $((i * 5))
            done
          done
          [ "$ok" = 1 ] || { echo "::error::Could not download Gradle $V"; exit 1; }
          unzip -q gradle.zip
          echo "$RUNNER_TEMP/gradle-${V}/bin" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK licenses + platform
        shell: bash
        run: |
          SDKM="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            set +o pipefail
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          fi

      - name: Download Moonshine Arabic model
        shell: bash
        working-directory: ${{ steps.loc.outputs.root }}
        run: |
          if [ -d app/src/main/assets/base-ar ] && [ -n "$(ls -A app/src/main/assets/base-ar 2>/dev/null)" ]; then
            echo "Model already bundled, skipping download."
            exit 0
          fi
          pip install moonshine-voice
          ROOTDIR="$PWD/model-cache"
          python -m moonshine_voice.download --language ar --stt --root "$ROOTDIR"
          echo "---- downloaded files ----"
          find "$ROOTDIR" -type f | head -80
          DIR=$(find "$ROOTDIR" -type f -name '*.ort' -printf '%h\n' | sort -u | grep -i base | head -1 || true)
          if [ -z "$DIR" ]; then
            DIR=$(find "$ROOTDIR" -type f \( -name '*.ort' -o -name '*.onnx' \) -printf '%h\n' | sort -u | head -1 || true)
          fi
          if [ -z "$DIR" ]; then
            echo "Not under --root, searching home cache..."
            DIR=$(find "$HOME" -type f \( -name '*.ort' -o -name '*.onnx' \) -not -path '*/site-packages/*' -printf '%h\n' 2>/dev/null | sort -u | head -1 || true)
          fi
          if [ -z "$DIR" ]; then
            echo "::error::Model files not found after download."
            exit 1
          fi
          echo "Model dir: $DIR"
          mkdir -p app/src/main/assets/base-ar
          cp -r "$DIR"/. app/src/main/assets/base-ar/
          echo "---- bundled model ----"
          ls -la app/src/main/assets/base-ar

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.loc.outputs.root }}
        run: |
          gradle --version
          for i in 1 2 3; do
            if gradle assembleDebug --stacktrace; then exit 0; fi
            echo "Build failed (try $i), retrying in 20s..."; sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: MoonshineSTT-apk
          path: ${{ steps.loc.outputs.root }}/app/build/outputs/apk/debug/*.apk
