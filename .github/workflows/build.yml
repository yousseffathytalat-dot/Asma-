name: Build APK

# يشتغل لوحده مع كل رفع، أو يدوي من تبويب Actions -> Run workflow.
# بيدعم الحالتين:
#   1) المشروع مرفوع كملفات عادية (settings.gradle.kts في أول الـ repo)
#   2) المشروع مرفوع وهو ZIP (أي ملف .zip) -> بيتفك أثناء البناء ويتبني.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Locate project (unzip if zipped)
        id: loc
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            ROOT="$PWD"
            echo "Project found as plain files."
          else
            echo "ZIP files in repo:"; find . -maxdepth 3 -iname '*.zip' -not -path './.git/*'
            # لو فيه أكتر من ZIP: ياخد الأحدث (آخر رفع)
            ZIP=$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | while IFS= read -r z; do echo "$(git log -1 --format=%ct -- "$z" 2>/dev/null || echo 0) $z"; done | sort -rn | awk 'NR==1{sub(/^[0-9]+ /,""); print}')
            if [ -z "$ZIP" ]; then
              echo "::error::No Gradle project and no .zip file found in the repo."
              exit 1
            fi
            echo "Unzipping: $ZIP"
            mkdir -p "$RUNNER_TEMP/proj"
            unzip -q -o "$ZIP" -d "$RUNNER_TEMP/proj"
            SETTINGS=$(find "$RUNNER_TEMP/proj" -name 'settings.gradle*' -not -path '*/__MACOSX/*' | head -n 1)
            if [ -z "$SETTINGS" ]; then
              echo "::error::Zip does not contain settings.gradle(.kts)."
              exit 1
            fi
            ROOT=$(cd "$(dirname "$SETTINGS")" && pwd)
          fi
          echo "Project root: $ROOT"
          ls -la "$ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Pin minSdk 26
        shell: bash
        working-directory: ${{ steps.loc.outputs.root }}
        run: |
          sed -i -E 's/minSdk = [0-9]+/minSdk = 26/' app/build.gradle.kts
          grep -nE "minSdk|versionName" app/build.gradle.kts

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Install Gradle 8.7 (retry + GitHub mirror)
        shell: bash
        run: |
          set -euo pipefail
          V=8.7
          cd "$RUNNER_TEMP"
          ok=0
          for url in \
            "https://github.com/gradle/gradle-distributions/releases/download/v${V}.0/gradle-${V}-bin.zip" \
            "https://services.gradle.org/distributions/gradle-${V}-bin.zip"; do
            for i in 1 2 3 4; do
              if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 -o gradle.zip "$url" && unzip -tq gradle.zip > /dev/null 2>&1; then
                ok=1; break 2
              fi
              echo "Download failed (try $i) from $url"; sleep $((i * 5))
            done
          done
          [ "$ok" = 1 ] || { echo "::error::Could not download Gradle $V"; exit 1; }
          unzip -q gradle.zip
          echo "$RUNNER_TEMP/gradle-${V}/bin" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK licenses + platform
        shell: bash
        run: |
          SDKM="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            set +o pipefail
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          fi

      - name: Download sherpa-onnx native libs (v2.0.1)
        shell: bash
        working-directory: ${{ steps.loc.outputs.root }}
        run: |
          set -euo pipefail
          V=v2.0.1
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/${V}/sherpa-onnx-${V}-android.tar.bz2"
          ok=0
          for i in 1 2 3 4; do
            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 -o "$RUNNER_TEMP/sherpa.tar.bz2" "$URL" && tar tjf "$RUNNER_TEMP/sherpa.tar.bz2" > /dev/null 2>&1; then ok=1; break; fi
            echo "Download failed (try $i)"; sleep $((i * 5))
          done
          [ "$ok" = 1 ] || { echo "::error::Could not download sherpa-onnx libs"; exit 1; }
          mkdir -p "$RUNNER_TEMP/sherpa"
          tar xjf "$RUNNER_TEMP/sherpa.tar.bz2" -C "$RUNNER_TEMP/sherpa"
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp -v "$RUNNER_TEMP/sherpa/jniLibs/$abi/libsherpa-onnx-jni.so" "$RUNNER_TEMP/sherpa/jniLibs/$abi/libonnxruntime.so" "app/src/main/jniLibs/$abi/"
          done
          # لو ملفات الـ Kotlin الخاصة بالمكتبة مش موجودة في المشروع، نجيبها من نفس الإصدار
          if [ ! -f app/src/main/java/com/k2fsa/sherpa/onnx/OfflineRecognizer.kt ]; then
            git clone -q --depth 1 --branch "$V" https://github.com/k2-fsa/sherpa-onnx.git "$RUNNER_TEMP/sherpa-src"
            mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx
            for f in OfflineRecognizer OfflineStream FeatureConfig HomophoneReplacerConfig QnnConfig; do
              cp "$RUNNER_TEMP/sherpa-src/sherpa-onnx/kotlin-api/$f.kt" app/src/main/java/com/k2fsa/sherpa/onnx/
            done
          fi
          find app/src/main/jniLibs -type f | sort

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.loc.outputs.root }}
        run: |
          gradle --version
          for i in 1 2 3; do
            if gradle assembleDebug --stacktrace; then exit 0; fi
            echo "Build failed (try $i), retrying in 20s..."; sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: WhisperSTT-apk
          path: ${{ steps.loc.outputs.root }}/app/build/outputs/apk/debug/*.apk
